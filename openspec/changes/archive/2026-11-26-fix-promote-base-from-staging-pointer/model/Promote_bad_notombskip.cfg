\* Pointer source, but pointer_base does NOT read past a deletion tombstone. A staging
\* pointer deleted (racing) between promote's no-op check and its base read then yields
\* "no base", so promote refuses a promote that should have advanced. Expected: FAIL —
\* Safe breaks (spurious refusal on the concurrent-delete TOCTOU).
SPECIFICATION Spec
CONSTANTS
    BaseSource = "pointer"
    TombstoneSkip = FALSE
    RecheckAfterConflict = TRUE
    Dedup = TRUE
INVARIANTS
    TypeOk
    Safe
