\* Lease discipline OFF (bug toggle): GC has no lease protection.
\* Expected: CHECK_FAILED — a concurrent sweep collects an in-flight publish's
\* blob (breaking BlobSafe) and/or drops its just-committed manifest (breaking
\* TipSafe), exactly the race the lease closes.
SPECIFICATION Spec

CONSTANTS
    Publishers = {p1, p2}
    NoTip = NoTip
    NoMark = NoMark
    LeaseDisabled = TRUE

INVARIANTS
    TypeOk
    BlobSafe
    TipSafe
