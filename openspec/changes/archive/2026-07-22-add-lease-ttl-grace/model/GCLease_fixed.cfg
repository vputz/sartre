\* TTL leases WITH the publish self-check: publish re-verifies its lease is still
\* valid before commit and before advance, aborting if it lapsed.
\* Expected: PASS — BlobSafe and TipSafe hold under every publish/expire/GC interleaving.
SPECIFICATION Spec

CONSTANTS
    Publishers = {p1, p2}
    NoTip = NoTip
    NoMark = NoMark
    SelfCheck = TRUE

INVARIANTS
    TypeOk
    BlobSafe
    TipSafe
