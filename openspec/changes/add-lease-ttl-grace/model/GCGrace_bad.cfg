\* Grace is OUTRUN by the publish window: Grace (1) <= MaxGap (2), horizon 3.
\* Expected: CHECK_FAILED — a writer puts a blob, time advances until the blob's
\* age reaches Grace (still within its MaxGap put->commit budget), GC sweeps the
\* now-too-old blob, then the writer commits over the hole: a committed manifest
\* references a missing blob. This is the honest limit of pure grace: g < d breaks.
SPECIFICATION Spec

CONSTANTS
    Writers = {w1, w2}
    NoMark = NoMark
    MaxTime = 3
    Grace = 1
    MaxGap = 2

INVARIANTS
    TypeOk
    BlobSafe
