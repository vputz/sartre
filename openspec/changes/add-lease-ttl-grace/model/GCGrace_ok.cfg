\* Grace COVERS the max publish duration: Grace (2) > MaxGap (1), horizon 3.
\* Expected: PASS — BlobSafe holds under every interleaving (an in-flight blob
\* is younger than Grace through its whole put->commit window, so GC never sweeps
\* it), AND GC still reclaims abandoned uploads once they age past Grace
\* (GCSweep's delete branch fires — non-vacuous).
SPECIFICATION Spec

CONSTANTS
    Writers = {w1, w2}
    NoMark = NoMark
    MaxTime = 3
    Grace = 2
    MaxGap = 1

INVARIANTS
    TypeOk
    BlobSafe
