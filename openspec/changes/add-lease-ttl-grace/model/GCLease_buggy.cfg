\* TTL leases WITHOUT the self-check (TTL added, publish barrels ahead).
\* Expected: CHECK_FAILED — a lease lapses mid-publish, GC sweeps the in-flight
\* blob (or drops the just-committed manifest), then publish commits/points over
\* it: BlobSafe and/or TipSafe break. This is the race TTL reopens.
SPECIFICATION Spec

CONSTANTS
    Publishers = {p1, p2}
    NoTip = NoTip
    NoMark = NoMark
    SelfCheck = FALSE

INVARIANTS
    TypeOk
    BlobSafe
    TipSafe
