\* CAS expected := the base the derive read. Expected: PASS — a concurrent publish
\* makes the advance conflict rather than overwrite, so no lost update; non-vacuous
\* (the derive can still succeed when nothing raced, and can conflict when something did).
SPECIFICATION Spec
CONSTANTS
    UseBaseExpected = TRUE
    MaxVer = 4
INVARIANTS
    TypeOk
    Safe
